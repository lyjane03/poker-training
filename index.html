<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>德州扑克策略训练器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-icon">♠</span>
        <div>
          <h1>德州扑克策略训练器</h1>
          <p class="tagline">从业余到进阶 · 理论 + 实战 + 复盘</p>
        </div>
      </div>
      <nav class="tabs">
        <button class="tab" data-view="library">📖 知识库</button>
        <button class="tab active" data-view="quiz">📚 题库训练</button>
        <button class="tab" data-view="draws">🎯 听牌特训</button>
        <button class="tab" data-view="drill">⚡ 场景特训</button>
        <button class="tab" data-view="range">📐 范围训练</button>
        <button class="tab" data-view="game">🎮 自由练习</button>
        <button class="tab" data-view="equity">🧮 胜率计算器</button>
        <button class="tab" data-view="history">🗂 历史复盘</button>
      </nav>
    </div>
  </header>

  <main id="app">
    <!-- 知识库视图 -->
    <section id="view-library" class="view">
      <div id="library-panel"></div>
    </section>

    <!-- 题库训练视图 -->
    <section id="view-quiz" class="view active">
      <div id="quiz-home"></div>
      <div id="quiz-session" class="hidden"></div>
    </section>

    <!-- 听牌特训视图 -->
    <section id="view-draws" class="view">
      <div id="draws-home"></div>
      <div id="draws-session" class="hidden"></div>
    </section>

    <!-- 场景特训视图 -->
    <section id="view-drill" class="view">
      <div id="drill-home"></div>
      <div id="drill-session" class="hidden"></div>
    </section>

    <!-- 范围训练视图 -->
    <section id="view-range" class="view">
      <div id="range-panel"></div>
    </section>

    <!-- 自由练习视图 -->
    <section id="view-game" class="view">
      <div id="game-home"></div>
      <div id="game-table" class="hidden"></div>
    </section>

    <!-- 胜率计算器视图 -->
    <section id="view-equity" class="view">
      <div id="equity-panel"></div>
    </section>

    <!-- 历史复盘视图 -->
    <section id="view-history" class="view">
      <div id="history-panel"></div>
    </section>
  </main>

  <script src="js/cards.js"></script>
  <script src="js/range-core.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/library-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/draws.js"></script>
  <script src="js/drill.js"></script>
  <script src="js/game.js"></script>
  <script src="js/equity.js"></script>
  <script src="js/range.js"></script>
  <script src="js/library.js"></script>
  <script src="js/history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
